<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/minimal-theme.css}"/>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 p-6">
    <div class="max-w-5xl mx-auto min-h-[calc(100vh-6rem)] flex items-center justify-center">
        <div class="w-full max-w-md bg-white rounded-xl shadow-sm border border-slate-200 py-6 px-8 flex flex-col gap-6">
        <h1 class="text-2xl font-semibold text-center">Crear cuenta</h1>

        <div th:if="${error}" class="p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm" th:text="${error}">
            Error
        </div>

        <form th:action="@{/register}" method="post" class="flex flex-col gap-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <input name="username" placeholder="Usuario" required th:value="${username}" class="w-full px-4 py-3 rounded-xl bg-gray-50"/>

            <input name="password" type="password" placeholder="Contraseña (mín. 6)" required class="w-full px-4 py-3 rounded-xl bg-gray-50"/>

            <input name="confirmPassword" type="password" placeholder="Confirmar contraseña" required class="w-full px-4 py-3 rounded-xl bg-gray-50"/>

            <button class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-700 text-white transition">Registrarme</button>
        </form>
        <div class="h-[1px] w-full bg-gray-200"></div>
        <p class="text-sm text-slate-900">
            ¿Ya tienes cuenta?
            <a th:href="@{/login}" class="text-slate-700 hover:text-slate-900 transition">Inicia sesión</a>
        </p>
            </div>
    </div>
    <footer class="app-footer text-center pb-6">© 2026 Gestor de Exámenes</footer>
</body>
</html>
