<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/minimal-theme.css}"/>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 p-6">
    <div class="max-w-5xl mx-auto min-h-[calc(100vh-6rem)] flex items-center justify-center">
        <div class="w-full max-w-md bg-white rounded-xl py-10 px-8 shadow-sm border border-slate-200 flex flex-col gap-6">
        <h1 class="text-2xl text-center font-semibold mb-4">Iniciar sesión</h1>

        <div th:if="${param.error}" class="mb-3 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm">
            Credenciales inválidas
        </div>
        <div th:if="${param.logout}" class="mb-3 p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/30">
            Sesión cerrada
        </div>
        <div th:if="${param.registered}" class="mb-3 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30">
            Registro exitoso. Ya puedes iniciar sesión.
        </div>

        <form th:action="@{/login}" method="post" class="flex flex-col gap-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input name="username" placeholder="Usuario" required class="w-full px-4 py-3 rounded-lg bg-gray-50"/>
            <input name="password" type="password" placeholder="Contraseña" required class="w-full px-4 py-3 rounded-lg bg-gray-50"/>
            <button class="w-full py-3 rounded-lg bg-slate-900 hover:bg-slate-700 text-white transition">Entrar</button>
        </form>

        <div class="h-[1px] w-full bg-gray-200"></div>

        <p class="text-sm text-slate-900">
            ¿No tienes cuenta?
            <a th:href="@{/register}" class="text-slate-700 hover:text-slate-900 transition">Regístrate</a>
        </p>
            </div>
    </div>
    <footer class="app-footer text-center pb-6">© 2026 Gestor de Exámenes</footer>
</body>
</html>
