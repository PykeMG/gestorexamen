<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Resultados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/minimal-theme.css}"/>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 p-6">
    <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-white border border-gray-200 rounded-2xl p-4">
        <h1 class="text-2xl font-semibold">Resultados</h1>
        <a th:href="@{/user/dashboard}" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-700 text-white transition">Volver</a>
    </div>

    <div th:if="${param.canceled != null}"
         class="p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-700 text-sm">
        El examen en curso fue cancelado por un administrador.
    </div>

    <div class="bg-white border border-gray-200 rounded-2xl p-5 overflow-x-auto">
        <table class="w-full text-sm">
        <thead class="text-gray-600">
        <tr>
            <th class="text-left py-2">ID</th>
            <th class="text-left py-2">Estado</th>
            <th class="text-left py-2">Nota</th>
            <th class="text-left py-2">Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${attempts}" class="border-t border-gray-200">
            <td class="py-2" th:text="${a.id}">1</td>
            <td class="py-2" th:text="${a.status.displayName}">terminado</td>
            <td class="py-2" th:text="${a.score}">-</td>
            <td class="py-2">
            <a th:if="${a.status.name()=='FINISHED'}"
                th:href="@{'/user/results/' + ${a.id}}"
                class="text-slate-900">Detalle</a>
            </td>
        </tr>
        </tbody>
        </table>
    </div>
    </div>
    <footer class="app-footer text-center pb-6">© 2026 Gestor de Exámenes</footer>
</body>
</html>
